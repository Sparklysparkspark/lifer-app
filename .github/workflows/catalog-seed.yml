name: Publish catalog seed

# Rebuilds the catalog seed + vector assets + manifest from the maintainer database and
# publishes them to the catalog-latest release. Run it by hand after any data change that isn't
# purely per-region (see docs/docs/contributing/rebuilding-data.md). Needs the secret
# CATALOG_SOURCE_DATABASE_URL, pointing at a database this runner can reach.

on:
  workflow_dispatch:
    inputs:
      postgres_major:
        description: "pg_dump major version (match the database server)"
        default: "18"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The input goes through env and is checked, never pasted into the script.
      - name: Install pg_dump
        env:
          POSTGRES_MAJOR: ${{ inputs.postgres_major }}
        run: |
          case "$POSTGRES_MAJOR" in ''|*[!0-9]*) echo "::error::postgres_major must be a number"; exit 1 ;; esac
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-$POSTGRES_MAJOR"
          echo "PG_DUMP_BIN=/usr/lib/postgresql/$POSTGRES_MAJOR/bin/pg_dump" >> "$GITHUB_ENV"
      - name: Build seed, gallery embeddings and manifest
        env:
          DATABASE_URL: ${{ secrets.CATALOG_SOURCE_DATABASE_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/catalog"
          npx tsx packages/data-pipeline/src/scripts/build-catalog-seed.ts "$RUNNER_TEMP/catalog/lifer-catalog-seed.sql.gz"
          ls -lh "$RUNNER_TEMP/catalog"
      # Manifest last, so an install never reads a manifest whose files aren't uploaded yet.
      - name: Upload to catalog-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/catalog"
          gh release view catalog-latest >/dev/null 2>&1 || gh release create catalog-latest --title "Catalog (latest)" --notes "Species catalog seed. Updated by the catalog-seed workflow." --prerelease --latest=false
          shopt -s nullglob
          # Every vector asset (CLIP and species identification model), not just the gallery
          # one: the manifest points at all of them.
          gh release upload catalog-latest lifer-catalog-seed.sql.gz ./*.bin.gz --clobber
          gh release upload catalog-latest catalog-manifest.json --clobber
