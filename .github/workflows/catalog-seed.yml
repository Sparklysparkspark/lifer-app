name: Publish catalog seed

# Rebuilds the catalog seed + gallery embeddings asset + manifest from the maintainer database and
# publishes them to the catalog-latest release. Run it by hand after any data change that isn't
# purely per-region (see packages/data-pipeline/SCRIPTS.md step 6). Needs the secret
# CATALOG_SOURCE_DATABASE_URL, pointing at a database this runner can reach.

on:
  workflow_dispatch:
    inputs:
      postgres_major:
        description: "pg_dump major version (match the database server)"
        default: "18"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install pg_dump ${{ inputs.postgres_major }}
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${{ inputs.postgres_major }}"
          echo "PG_DUMP_BIN=/usr/lib/postgresql/${{ inputs.postgres_major }}/bin/pg_dump" >> "$GITHUB_ENV"
      - name: Build seed, gallery embeddings and manifest
        env:
          DATABASE_URL: ${{ secrets.CATALOG_SOURCE_DATABASE_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/catalog"
          npx tsx packages/data-pipeline/src/scripts/build-catalog-seed.ts "$RUNNER_TEMP/catalog/lifer-catalog-seed.sql.gz"
          ls -lh "$RUNNER_TEMP/catalog"
      # Manifest last, so an install never reads a manifest whose files aren't uploaded yet.
      - name: Upload to catalog-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/catalog"
          gh release view catalog-latest >/dev/null 2>&1 || gh release create catalog-latest --title "Catalog (latest)" --notes "Species catalog seed. Updated by the catalog-seed workflow." --prerelease
          shopt -s nullglob
          gh release upload catalog-latest lifer-catalog-seed.sql.gz lifer-gallery-embeddings-*.bin.gz --clobber
          gh release upload catalog-latest catalog-manifest.json --clobber
