name: Desktop build

# A manual, unsigned macOS build for testing a branch. release.yml builds and signs every
# platform for a release. Run it on main once per architecture after changing
# build-ffmpeg-macos.sh or build-postgres-macos.sh, so release tags can reuse the caches it saves.
# Pull requests and release.yml run only its PostgreSQL upgrade test, on Apple Silicon.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Mac architecture: arm64 (Apple Silicon) or x64 (Intel, cross-compiled)"
        type: choice
        options: [arm64, x64]
        default: arm64
      pg_upgrade_test:
        description: "Also test the embedded database's upgrade from the previous PostgreSQL major (17 to 18)"
        type: boolean
        default: false
  # release.yml runs the upgrade test before building a release (build: false).
  workflow_call:
    inputs:
      arch:
        type: string
        default: arm64
      pg_upgrade_test:
        type: boolean
        default: false
      build:
        description: Also build the unsigned app
        type: boolean
        default: true
  # A pull request that changes the upgrade or the bundled PostgreSQL runs the upgrade test only.
  pull_request:
    paths:
      - apps/desktop/src-tauri/src/pg_upgrade.rs
      - apps/desktop/src-tauri/src/embedded_db.rs
      - apps/desktop/scripts/stage-postgres.js
      - apps/desktop/scripts/build-postgres-macos.sh
      - apps/desktop/src-tauri/tests/pg-upgrade-test.sh
      - apps/desktop/src-tauri/tests/pg-upgrade/**
      - .github/workflows/desktop-build.yml
      - .github/actions/macos-natives/**

permissions:
  contents: read

jobs:
  build:
    # inputs.build is unset (null) for workflow_dispatch, so only an explicit false skips it.
    if: github.event_name == 'workflow_dispatch' || inputs.build == true
    runs-on: macos-14
    timeout-minutes: 60
    env:
      # Both architectures build on Apple Silicon; the Intel one is a cross build (see
      # apps/desktop/scripts/target.js). Same cache keys as release.yml.
      LIFER_TARGET_TRIPLE: ${{ inputs.arch == 'x64' && 'x86_64-apple-darwin' || '' }}
      MAC_ARCH: ${{ inputs.arch == 'x64' && 'x86_64' || 'arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ env.LIFER_TARGET_TRIPLE }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: macos-${{ inputs.arch }}
      # The Intel build runs its x86_64 FFmpeg, PostgreSQL and Node under Rosetta 2 to check them.
      - name: Install Rosetta 2
        if: inputs.arch == 'x64'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - run: npm ci
      # The FFmpeg and PostgreSQL the macOS app ships (see release.yml), same caches.
      - uses: ./.github/actions/macos-natives
        with:
          mac-arch: ${{ env.MAC_ARCH }}
      - run: npm run dist -w desktop
      - name: Check the app's native modules
        shell: bash
        run: |
          APP="apps/desktop/src-tauri/target/${LIFER_TARGET_TRIPLE:+$LIFER_TARGET_TRIPLE/}release/bundle/macos/Lifer.app"
          arch -"$MAC_ARCH" "$APP/Contents/MacOS/node" apps/desktop/scripts/check-bundled-natives.js "$APP/Contents/Resources"
          echo "APP=$APP" >> "$GITHUB_ENV"
      # Zipped with ditto: uploading the .app folder directly drops its symlinks and executable
      # bits, and the downloaded app won't open.
      - name: Zip the app
        run: ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Lifer-macos-${{ inputs.arch }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifer-desktop-macos-${{ inputs.arch }}
          path: ${{ runner.temp }}/Lifer-macos-${{ inputs.arch }}.zip

  # The desktop app's PostgreSQL major upgrade, end to end (apps/desktop/src-tauri/tests/
  # pg-upgrade-test.sh): a migrated 17 cluster with sentinel data, upgraded by the 18 the app
  # bundles with each method, a crash mid-upgrade, and the API on the result. See "The database
  # upgrade on a new major" in docs/docs/contributing/desktop-app.md.
  pg-upgrade:
    if: github.event_name == 'pull_request' || inputs.pg_upgrade_test
    runs-on: macos-14
    timeout-minutes: 60
    env:
      LIFER_TARGET_TRIPLE: ${{ inputs.arch == 'x64' && 'x86_64-apple-darwin' || '' }}
      MAC_ARCH: ${{ inputs.arch == 'x64' && 'x86_64' || 'arm64' }}
      # The bundled major and the previous one, as build-postgres-macos.sh names them.
      PREVIOUS_MAJOR: "17"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ env.LIFER_TARGET_TRIPLE }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: macos-${{ inputs.arch || 'arm64' }}-test
      - name: Install Rosetta 2
        if: inputs.arch == 'x64'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - run: npm ci
      # The API the script starts on the upgraded database.
      - run: npm run build -w api
      # tauri-build resolves the sidecar and every resource folder; the test needs none of the
      # folders' contents.
      - run: npm run fetch-node-sidecar -w desktop
      - name: Make the resource folders
        run: mkdir -p apps/desktop/src-tauri/resources-staging/{api,web,node_modules,catalog-seed,postgres,postgres-previous}
      # The same caches the build job uses for the bundled major, plus the previous one.
      - uses: ./.github/actions/macos-natives
        with:
          mac-arch: ${{ env.MAC_ARCH }}
          ffmpeg: "false"
          previous-major: ${{ env.PREVIOUS_MAJOR }}
      - name: Test the upgrade
        shell: bash
        run: |
          bash apps/desktop/src-tauri/tests/pg-upgrade-test.sh \
            "$RUNNER_TEMP/lifer-postgres-$PREVIOUS_MAJOR-$MAC_ARCH" "$RUNNER_TEMP/lifer-postgres-$MAC_ARCH" $LIFER_TARGET_TRIPLE
