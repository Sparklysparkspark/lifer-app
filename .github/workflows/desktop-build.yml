name: Desktop build

on:
  workflow_dispatch:

jobs:
  build:
    # A manual, unsigned macOS build for testing. release.yml builds every platform.
    strategy:
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run dist -w desktop
      - uses: actions/upload-artifact@v4
        with:
          name: lifer-desktop-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/macos/Lifer.app
