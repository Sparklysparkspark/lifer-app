name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    strategy:
      # Each OS builds only its own installer format (zipped .app + signed updater artifact on
      # macOS — see below, tauri-bundler's dmg target hits a bundle_dmg.sh bug on current
      # macOS runner images, so this deliberately isn't a real .dmg yet; nsis on Windows;
      # deb+AppImage on Linux — see tauri.conf.json's bundle.targets, which lists all of them;
      # tauri-bundler silently only produces whichever ones are valid for the host it's
      # actually running on). Native modules (sharp, exiftool-vendored) are copied into the
      # app as plain resources rather than rebuilt per-arch, so each target still needs its own
      # `npm ci` on matching hardware for correctly-compiled binaries. The auto-updater
      # (build-update-manifest.js) stays macOS-only for now — it self-skips on other
      # platforms — so Windows/Linux builds are download-and-reinstall-to-update for now, no
      # in-app update check.
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Tauri's Linux bundler (deb + AppImage) links against these at build time — not
      # preinstalled on the ubuntu-latest runner image. macOS/Windows have everything they need
      # already (Xcode CLT / MSVC + WebView2, both preinstalled on their respective runners).
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      # Real release version, not the permanent "0.1.0" placeholder — so the running app has
      # something to compare against the updater manifest's version. Derived from the pushed
      # tag (v1.2.3 -> 1.2.3), not hand-maintained. Cross-platform (not bash-only) since this
      # step also runs on the Windows runner, which defaults to PowerShell for `run:`.
      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' apps/desktop/src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json apps/desktop/src-tauri/tauri.conf.json
          echo "LIFER_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      # linuxdeploy/appimagetool are themselves AppImages, which need to mount via FUSE to run
      # normally — installing libfuse2 alone wasn't enough, since GitHub's ubuntu-latest runner
      # sandbox blocks the unprivileged user namespace FUSE needs regardless of the library
      # being present. Extract-and-run mode sidesteps FUSE entirely (unpack the AppImage to a
      # temp dir and exec the binary directly) — this is the standard workaround for exactly
      # this "failed to run linuxdeploy" error in CI.
      - run: npm run dist -w desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Zip the macOS app for upload
        if: matrix.os == 'macos-14'
        run: cd apps/desktop/src-tauri/target/release/bundle/macos && zip -r Lifer-macos-arm64.zip Lifer.app
      # Must run after resign-macos.js (part of `npm run dist` above) — the updater archive has
      # to be built from the RESIGNED .app, not tauri build's raw output (see
      # build-update-manifest.js's own comment). Produces Lifer.app.tar.gz + latest.json,
      # signed with the updater's private key (GitHub secrets, never committed — see
      # apps/desktop/.gitignore's .updater-keys/ entry for the local-dev equivalent). No-ops on
      # Windows/Linux (see that script's own platform check).
      - name: Build signed update artifact + manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build-update-manifest -w desktop
      - name: Upload macOS installers to the release
        if: matrix.os == 'macos-14'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/macos/Lifer-macos-arm64.zip
            apps/desktop/src-tauri/target/release/bundle/macos/Lifer.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/Lifer.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/macos/latest.json
      - name: Upload Windows installer to the release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload Linux installers to the release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Actions expressions have no toLower()/toUpper() (that's an Azure Pipelines
      # function, not a GitHub one) — ghcr.io requires an all-lowercase image name, so this
      # has to be computed in a shell step instead.
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
