name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    strategy:
      # Each OS builds only its own installer format (zipped .app + signed updater artifact on
      # macOS — see below, tauri-bundler's dmg target hits a bundle_dmg.sh bug on current
      # macOS runner images, so this deliberately isn't a real .dmg yet; nsis on Windows;
      # deb+AppImage on Linux — see tauri.conf.json's bundle.targets, which lists all of them;
      # tauri-bundler silently only produces whichever ones are valid for the host it's
      # actually running on). Native modules (sharp, exiftool-vendored) are copied into the
      # app as plain resources rather than rebuilt per-arch, so each target still needs its own
      # `npm ci` on matching hardware for correctly-compiled binaries — this is exactly why
      # Intel Mac support is its own matrix entry (macos-13, GitHub's last x86_64 macOS runner
      # image) rather than a `--target` flag on the macos-14 (Apple Silicon) job: sharp's native
      # bindings have to actually be compiled on x86_64 hardware, cross-compiling them from
      # arm64 isn't something `npm ci` does. The auto-updater (build-update-manifest.js) stays
      # macOS-only for now — it self-skips on other platforms — so Windows/Linux builds are
      # download-and-reinstall-to-update for now, no in-app update check. The two macOS jobs
      # each produce a partial updater manifest (their own architecture only); merge-update-
      # manifest below combines them into the one real latest.json the release ships.
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Tauri's Linux bundler (deb + AppImage) links against these at build time — not
      # preinstalled on the ubuntu-latest runner image. macOS/Windows have everything they need
      # already (Xcode CLT / MSVC + WebView2, both preinstalled on their respective runners).
      # fuse (not just libfuse2) + an explicitly-loaded kernel module + writable /dev/fuse is the
      # full combo AppImage's own FUSE mount needs — libfuse2 alone is just the shared library,
      # not the fusermount binary or the actual mount capability. Other projects build AppImages
      # fine on this same runner image, so the earlier "FUSE is blocked here, full stop"
      # conclusion (after only installing libfuse2) was premature — worth this fuller attempt
      # before ruling it out for good.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fuse libfuse2
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - run: npm ci
      # Real release version, not the permanent "0.1.0" placeholder — so the running app has
      # something to compare against the updater manifest's version. Derived from the pushed
      # tag (v1.2.3 -> 1.2.3), not hand-maintained. Cross-platform (not bash-only) since this
      # step also runs on the Windows runner, which defaults to PowerShell for `run:`.
      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' apps/desktop/src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json apps/desktop/src-tauri/tauri.conf.json
          echo "LIFER_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      # Pulled into the GitHub release body below (see CHANGELOG.md's own header comment) — this
      # is what apps/web/src/pages/SettingsPage.tsx's AppUpdatesSection actually shows the user
      # (`update.body`, from the Tauri updater manifest, which is sourced from the release this
      # same tag creates). Prefers a heading already renamed to this version
      # (`## [$VERSION]`); falls back to `## [Unreleased]` if whoever cut this release forgot to
      # rename it first, rather than shipping an empty body.
      - name: Extract this version's changelog section
        shell: bash
        run: |
          awk -v ver="$LIFER_RELEASE_VERSION" '
            /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") found=1; next }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-section.md
          if [ ! -s /tmp/changelog-section.md ]; then
            awk '
              /^## \[Unreleased\]/ { found=1; next }
              /^## \[/ { if (found) exit; next }
              found { print }
            ' CHANGELOG.md > /tmp/changelog-section.md
          fi
      # Linux only: linuxdeploy (and its bundled AppImage plugins) ship as legacy AppImages that
      # self-mount via FUSE when executed — current ubuntu-latest (24.04) runners block
      # unprivileged FUSE mounts via AppArmor even with libfuse2 installed and /dev/fuse
      # writable (see "Install Linux system dependencies" above), so the mount silently fails
      # and tauri-bundler only ever surfaces the generic "failed to run linuxdeploy", never the
      # real underlying error. This env var (respected by the AppImage runtime itself, so it
      # covers linuxdeploy AND its plugins in one shot) forces extract-and-run instead of a FUSE
      # mount, which needs no special kernel/container permissions at all. No-op on macOS/Windows.
      - run: npm run dist -w desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      # Filename carries the architecture (macos-14 = arm64, macos-13 = Intel/x86_64) so both
      # macOS jobs can upload to the same release without one silently overwriting the other's
      # same-named asset.
      - name: Zip the macOS app for upload
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          ARCH_LABEL=$([ "${{ matrix.os }}" = "macos-14" ] && echo "arm64" || echo "x86_64")
          cd apps/desktop/src-tauri/target/release/bundle/macos && zip -r "Lifer-macos-$ARCH_LABEL.zip" Lifer.app
      # Must run after resign-macos.js (part of `npm run dist` above) — the updater archive has
      # to be built from the RESIGNED .app, not tauri build's raw output (see
      # build-update-manifest.js's own comment). Produces Lifer-<arch>.app.tar.gz +
      # latest-<arch>.json (a PARTIAL manifest — just this job's own architecture; see
      # merge-update-manifest below), signed with the updater's private key (GitHub secrets,
      # never committed — see apps/desktop/.gitignore's .updater-keys/ entry for the local-dev
      # equivalent). No-ops on Windows/Linux (see that script's own platform check).
      - name: Build signed update artifact + manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build-update-manifest -w desktop
      - name: Upload partial update manifest
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/macos/latest-*.json
      - name: Upload macOS installers to the release
        if: startsWith(matrix.os, 'macos')
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog-section.md
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/macos/Lifer-macos-*.zip
            apps/desktop/src-tauri/target/release/bundle/macos/Lifer-*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/Lifer-*.app.tar.gz.sig
      - name: Upload Windows installer to the release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog-section.md
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload Linux installers to the release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog-section.md
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  # Combines the arm64 and x86_64 macOS jobs' partial updater manifests into the single real
  # latest.json the release ships — see merge-update-manifests.js's own comment for why this
  # can't just be another step inside the `desktop` matrix job (each matrix job only ever sees
  # its own architecture's output; this needs both).
  merge-update-manifest:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: update-manifest-macos-*
          path: /tmp/update-manifests
      - run: node apps/desktop/scripts/merge-update-manifests.js /tmp/update-manifests /tmp/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/latest.json

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Actions expressions have no toLower()/toUpper() (that's an Azure Pipelines
      # function, not a GitHub one) — ghcr.io requires an all-lowercase image name, so this
      # has to be computed in a shell step instead.
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # v1.2.3 -> 1.2.3, same derivation as the desktop build's own "Set app version from tag"
      # step above.
      - name: Strip v prefix from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Baked into the image so a running container can report its real version via
          # GET /version.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
