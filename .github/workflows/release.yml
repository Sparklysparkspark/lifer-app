name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Creates the release as a DRAFT up front, so "latest" never points at a release whose
  # latest.json hasn't been uploaded yet (a failed Windows leg once left v0.5.6 published with no
  # manifest, which 404'd the updater for every user). merge-update-manifest publishes it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node apps/desktop/scripts/extract-changelog-section.js "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists (re-run), reusing it"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi

  desktop:
    needs: create-release
    strategy:
      # Each OS builds only its own installer format (zipped .app + signed updater artifact on
      # macOS — see below, tauri-bundler's dmg target hits a bundle_dmg.sh bug on current
      # macOS runner images, so this deliberately isn't a real .dmg yet; nsis on Windows;
      # deb+AppImage on Linux — see tauri.conf.json's bundle.targets, which lists all of them;
      # tauri-bundler silently only produces whichever ones are valid for the host it's
      # actually running on). build-update-manifest.js runs on every OS and produces a real
      # in-app-update entry for macOS, Windows (the NSIS .exe), and Linux (the AppImage only —
      # a .deb install lives under a root-owned prefix a regular user process can't overwrite,
      # so .deb stays download-and-reinstall-to-update; AppImage and every other platform get a
      # real in-app update check).
      #
      # Intel Mac (x86_64) is dropped from CI: GitHub retired the macos-13 runner, so that leg
      # queued forever. Only Apple Silicon (macos-14) builds on hosted runners now.
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Tauri's Linux bundler (deb + AppImage) links against these at build time — not
      # preinstalled on the ubuntu-latest runner image. macOS/Windows have everything they need
      # already (Xcode CLT / MSVC + WebView2, both preinstalled on their respective runners).
      # fuse (not just libfuse2) + an explicitly-loaded kernel module + writable /dev/fuse is the
      # full combo AppImage's own FUSE mount needs — libfuse2 alone is just the shared library,
      # not the fusermount binary or the actual mount capability. Other projects build AppImages
      # fine on this same runner image, so the earlier "FUSE is blocked here, full stop"
      # conclusion (after only installing libfuse2) was premature — worth this fuller attempt
      # before ruling it out for good.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fuse libfuse2
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - run: npm ci
      # Real release version, not the permanent "0.1.0" placeholder — so the running app has
      # something to compare against the updater manifest's version. Derived from the pushed
      # tag (v1.2.3 -> 1.2.3), not hand-maintained. Cross-platform (not bash-only) since this
      # step also runs on the Windows runner, which defaults to PowerShell for `run:`.
      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' apps/desktop/src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json apps/desktop/src-tauri/tauri.conf.json
          echo "LIFER_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      # Linux only: linuxdeploy (and its bundled AppImage plugins) ship as legacy AppImages that
      # self-mount via FUSE when executed — current ubuntu-latest (24.04) runners block
      # unprivileged FUSE mounts via AppArmor even with libfuse2 installed and /dev/fuse
      # writable (see "Install Linux system dependencies" above), so the mount silently fails
      # and tauri-bundler only ever surfaces the generic "failed to run linuxdeploy", never the
      # real underlying error. This env var (respected by the AppImage runtime itself, so it
      # covers linuxdeploy AND its plugins in one shot) forces extract-and-run instead of a FUSE
      # mount, which needs no special kernel/container permissions at all. No-op on macOS/Windows.
      #
      # Still failing with the same swallowed "failed to run linuxdeploy" message even with
      # extract-and-run forced on — TAURI_BUILD_ARGS=--verbose (only set for ubuntu-latest, a
      # no-op elsewhere) makes tauri-bundler print linuxdeploy's actual stdout/stderr instead of
      # its generic wrapper error, since that's the only way to see the real failure short of
      # attaching a debugger to a hosted runner.
      # Signs the macOS app with a stable self-signed "Lifer" identity (see resign-macos.js) so
      # macOS folder permissions and the updater's code requirement survive across versions.
      # Skipped (ad-hoc signing) when the secret isn't set.
      - name: Import macOS signing certificate
        if: startsWith(matrix.os, 'macos')
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "MACOS_CERT_P12_BASE64 not set, falling back to ad-hoc signing"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/lifer-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/lifer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/lifer.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/lifer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # codesign will sign with this identity by name even though it isn't in the system
          # trust store (confirmed: `security find-identity -v` reports it untrusted, but a
          # plain `codesign -s Lifer` still signs fine), so no system trust step is needed here.
          echo "MACOS_SIGNING_IDENTITY=Lifer" >> "$GITHUB_ENV"
      - run: npm run dist -w desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_BUILD_ARGS: ${{ matrix.os == 'ubuntu-latest' && '--verbose' || '' }}
      # Only macos-14 (arm64) builds now — see the matrix comment above on why Intel Mac is
      # dropped — but the filename keeps its arch label so a future re-added x86_64 runner
      # wouldn't silently collide with this asset's name.
      - name: Zip the macOS app for upload
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/macos && zip -r "Lifer-macos-arm64.zip" Lifer.app
      # Must run after resign-macos.js on macOS (part of `npm run dist` above) — the updater
      # archive has to be built from the RESIGNED .app, not tauri build's raw output (see
      # build-update-manifest.js's own comment). Produces one signed update artifact + a PARTIAL
      # manifest (just this job's own platform key; see merge-update-manifest below) for every
      # OS, signed with the updater's private key (GitHub secrets, never committed — see
      # apps/desktop/.gitignore's .updater-keys/ entry for the local-dev equivalent).
      - name: Build signed update artifact + manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build-update-manifest -w desktop
      - name: Upload partial update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/update-manifest/latest-*.json
      # NSIS can't build an installer over 2GB, and anything near that makes every update a huge
      # download. Fail early with a clear message instead of an opaque makensis error.
      - name: Check installer sizes
        shell: bash
        run: |
          big=$(find apps/desktop/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.deb' \) -size +1536M)
          if [ -n "$big" ]; then
            echo "::error::Installer over 1.5GB (is the catalog seed or a model being bundled?):"
            ls -lh $big
            exit 1
          fi
      - name: Upload installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=apps/desktop/src-tauri/target/release/bundle
          case "${{ matrix.os }}" in
            macos-*) files=("$B"/macos/Lifer-macos-*.zip "$B"/macos/Lifer-*.app.tar.gz "$B"/macos/Lifer-*.app.tar.gz.sig) ;;
            windows-*) files=("$B"/nsis/*.exe) ;;
            ubuntu-*) files=("$B"/deb/*.deb "$B"/appimage/*.AppImage) ;;
          esac
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  # Combines every matrix job's partial updater manifest (macOS, Windows, Linux) into the single
  # real latest.json the release ships — see merge-update-manifests.js's own comment for why this
  # can't just be another step inside the `desktop` matrix job (each matrix job only ever sees
  # its own platform's output; this needs all of them).
  # Runs even when a platform leg failed (one broken OS must not break updates for the others);
  # merge-update-manifests.js warns about missing platforms instead of failing. Publishing the
  # draft happens only here, after latest.json is attached.
  merge-update-manifest:
    needs: [create-release, desktop]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: update-manifest-*
          path: /tmp/update-manifests
      - run: node apps/desktop/scripts/extract-changelog-section.js "${GITHUB_REF_NAME#v}" > /tmp/notes.md
      - run: node apps/desktop/scripts/merge-update-manifests.js /tmp/update-manifests /tmp/latest.json /tmp/notes.md
      - name: Attach latest.json and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" /tmp/latest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Actions expressions have no toLower()/toUpper() (that's an Azure Pipelines
      # function, not a GitHub one) — ghcr.io requires an all-lowercase image name, so this
      # has to be computed in a shell step instead.
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # v1.2.3 -> 1.2.3, same derivation as the desktop build's own "Set app version from tag"
      # step above.
      - name: Strip v prefix from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Baked into the image so a running container can report its real version via
          # GET /version.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
