[package]
name = "lifer-desktop"
version = "0.1.0"
description = "Lifer desktop app"
authors = ["Lifer"]
edition = "2021"

[lib]
name = "lifer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
url = "2"
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }
postgresql_commands = { version = "0.21.0", default-features = false, features = ["tokio"] }
flate2 = "1.1.10"

[target.'cfg(target_os = "macos")'.dependencies]
# For hiding the native traffic light buttons in light theme (see src/mac_window.rs) — no
# Tauri-level API exposes this, only the raw NSWindow pointer (window.ns_window()), so this
# calls straight into AppKit. Versions pinned to exactly what tao/wry already resolve
# (Cargo.lock) so this doesn't pull in a second copy of either crate.
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
