[package]
name = "lifer-desktop"
version = "0.9.0"
description = "Lifer desktop app"
authors = ["Lifer contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/Sparklysparkspark/lifer-app"
edition = "2021"

[lib]
name = "lifer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Debug builds (tauri dev) always have devtools. Opt in for a release build with
# `--features devtools`.
[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
url = "2"
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }
postgresql_commands = { version = "0.21.0", default-features = false, features = ["tokio"] }
flate2 = "1.1.10"
getrandom = "0.3"
sha2 = "0.11"
