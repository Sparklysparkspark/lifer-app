[package]
name = "lifer-desktop"
version = "0.12.0"
description = "Lifer desktop app"
authors = ["Lifer contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/Sparklysparkspark/lifer-app"
edition = "2021"

[lib]
name = "lifer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Debug builds (tauri dev) always have devtools. Opt in for a release build with
# `--features devtools`.
[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "net", "rt", "io-util"] }
url = "2"
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }
postgresql_commands = { version = "0.22.0", default-features = false, features = ["tokio"] }
getrandom = "0.4"
sha2 = "0.11"
hmac = "0.13"
minisign-verify = "0.3"
# Phone companion LAN listener (companion_listener.rs): certificate, TLS 1.3, HTTP, discovery.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
mdns-sd = "0.22"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
if-addrs = "0.15"
tauri-plugin-autostart = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKOpenPanelParameters", "block2"] }

# Lifer hashes unsigned companion apps before each launch; unoptimised SHA-256 takes seconds on a big app.
[profile.dev.package.sha2]
opt-level = 3
