"$schema" = "schemas/schema.json"

# Every command registered in lib.rs's tauri::generate_handler![...]. Tauri v2's ACL denies the
# app's own commands too unless a permission grants them; keep this list in sync with that one.
# Commands that reconfigure the app also check is_trusted_sender themselves.
[[permission]]
identifier = "allow-app-commands"
description = "Allow this app's own Tauri commands (see lib.rs's generate_handler! list)"
commands.allow = [
  "get_config",
  "choose_setup",
  "platform",
  "set_window_theme_background",
  "current_network_info",
  "test_endpoint",
  "test_login",
  "app_install_info",
]
