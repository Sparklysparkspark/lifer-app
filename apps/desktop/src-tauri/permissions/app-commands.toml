"$schema" = "schemas/schema.json"

# Every command registered in lib.rs's tauri::generate_handler![...]. Tauri v2's ACL denies the
# app's own commands too unless a permission grants them; keep this list in sync with that one.
# Commands that reconfigure the app also check is_trusted_sender themselves.
[[permission]]
identifier = "allow-app-commands"
description = "Allow this app's own Tauri commands (see lib.rs's generate_handler! list)"
commands.allow = [
  "get_config",
  "choose_setup",
  "platform",
  "set_window_theme_background",
  "current_network_info",
  "test_endpoint",
  "test_login",
  "app_install_info",
  "set_local_data_dir",
  "local_inference_status",
  "local_inference_prepare",
  "local_embed",
  "use_local_library",
  "local_api_credential",
  # offline_cache.rs: writes are checked against the connected server's origin, reads against the
  # bundled offline.html page.
  "offline_cache_begin",
  "offline_cache_put_thumb",
  "offline_cache_commit",
  "offline_cache_clear",
  "offline_cache_info",
  "set_offline_cache",
  "offline_cache_snapshot",
  "offline_cache_thumb",
  "offline_retry",
  "offline_use_local_library",
]
