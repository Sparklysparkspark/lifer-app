<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lifer</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f6eedc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #5f6b6f;
        font-size: 13px;
        text-align: center;
      }
      #startup-title {
        color: #242c34;
        font-size: 15px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141516;
          color: #a9aca9;
        }
        #startup-title {
          color: #eceae5;
        }
      }
    </style>
    <script src="startup.js"></script>
  </head>
  <body>
    <!-- Shown while lib.rs's setup() starts the local API or reaches the remote server.
         pg_upgrade.rs updates it through startup.js while it upgrades the database. -->
    <div>
      <div id="startup-title">Starting Lifer…</div>
      <div id="startup-detail"></div>
      <div id="startup-note" hidden>
        This happens once, after an update that includes a new version of the database. Please keep Lifer open; it
        can take a few minutes for a large library.
      </div>
    </div>
  </body>
</html>
