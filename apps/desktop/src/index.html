<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lifer</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f6eedc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #78716c;
        font-size: 13px;
        text-align: center;
      }
      #startup-title {
        color: #44403c;
        font-size: 15px;
      }
      #startup-detail {
        margin-top: 6px;
      }
      #startup-note {
        margin-top: 14px;
        max-width: 360px;
        line-height: 1.5;
      }
    </style>
    <script src="startup.js"></script>
  </head>
  <body>
    <!-- Shown while lib.rs's setup() starts the local API or reaches the remote server.
         pg_upgrade.rs updates it through startup.js while it upgrades the database. -->
    <div>
      <div id="startup-title">Starting Lifer…</div>
      <div id="startup-detail"></div>
      <div id="startup-note" hidden>
        This happens once, after an update that includes a new version of the database. Please keep Lifer open; it
        can take a few minutes for a large library.
      </div>
    </div>
  </body>
</html>
