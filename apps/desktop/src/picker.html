<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Set up Lifer</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #fafaf9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c1917;
      }
      .card {
        width: 380px;
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        padding: 28px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        font-size: 13px;
        color: #78716c;
        margin: 0 0 20px;
      }
      button.option {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        margin-bottom: 10px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      button.option:hover {
        background: #f5f5f4;
      }
      button.option strong {
        display: block;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .server-form {
        display: none;
        margin-top: 8px;
      }
      .server-form.open {
        display: block;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      button.primary {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #1c1917;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      .error {
        color: #dc2626;
        font-size: 12px;
        margin: -4px 0 10px;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 2px 0 12px;
      }
      .checkbox-row input[type="checkbox"] {
        margin: 0;
      }
      .checkbox-row label {
        font-size: 13px;
        cursor: pointer;
      }
      label.field-label {
        display: block;
        font-size: 12px;
        color: #78716c;
        margin: 0 0 4px;
      }
      .external-field {
        display: none;
      }
      .external-field.open {
        display: block;
      }
      .hint {
        font-size: 11px;
        color: #78716c;
        margin: -6px 0 10px;
      }
      .status {
        margin: 12px 0 0;
      }
      .warning {
        color: #b45309;
        font-size: 12px;
        margin: -4px 0 10px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Set up Lifer</h1>
      <p>How do you want to use Lifer on this Mac?</p>

      <button class="option" id="use-local">
        <strong>Pick Local Storage Folder</strong>
      </button>

      <button class="option" id="show-server-form">
        <strong>Connect to a Server</strong>
      </button>

      <div class="server-form" id="server-form">
        <label class="field-label" id="server-url-label" for="server-url">Server address</label>
        <input type="text" id="server-url" placeholder="https://lifer.example.com" />

        <div class="checkbox-row">
          <input type="checkbox" id="ip-switching" />
          <label for="ip-switching">Automatic URL Switching (connect locally over a designated Wi-Fi network)</label>
        </div>

        <div class="external-field" id="external-field">
          <label class="field-label" for="local-network-name">Wi-Fi network name</label>
          <input type="text" id="local-network-name" placeholder="HomeWiFi" />
          <label class="field-label" for="external-url">External address (away from home)</label>
          <input type="text" id="external-url" placeholder="https://lifer.example.com" />
          <p class="hint">
            Add more external addresses later from Settings &gt; Server.
          </p>
        </div>

        <div class="warning" id="http-warning" hidden></div>
        <div class="error" id="error" hidden></div>
        <button class="primary" id="connect">Connect</button>
      </div>

      <p class="status" id="status" hidden></p>
    </div>

    <script src="bridge.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
