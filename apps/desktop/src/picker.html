<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Set up Lifer</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #fafaf9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c1917;
      }
      .card {
        width: 380px;
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        padding: 28px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        font-size: 13px;
        color: #78716c;
        margin: 0 0 20px;
      }
      button.option {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        margin-bottom: 10px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      button.option:hover {
        background: #f5f5f4;
      }
      button.option strong {
        display: block;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .server-form {
        display: none;
        margin-top: 8px;
      }
      .server-form.open {
        display: block;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      button.primary {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #1c1917;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      .error {
        color: #dc2626;
        font-size: 12px;
        margin: -4px 0 10px;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 2px 0 12px;
      }
      .checkbox-row input[type="checkbox"] {
        margin: 0;
      }
      .checkbox-row label {
        font-size: 13px;
        cursor: pointer;
      }
      label.field-label {
        display: block;
        font-size: 12px;
        color: #78716c;
        margin: 0 0 4px;
      }
      .external-field {
        display: none;
      }
      .external-field.open {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Set up Lifer</h1>
      <p>How do you want to use Lifer on this Mac?</p>

      <button class="option" id="use-local">
        <strong>Pick Local Storage Folder</strong>
      </button>

      <button class="option" id="show-server-form">
        <strong>Connect to a Server</strong>
      </button>

      <div class="server-form" id="server-form">
        <label class="field-label" id="server-url-label" for="server-url">Server address</label>
        <input type="text" id="server-url" placeholder="https://lifer.example.com" />

        <div class="checkbox-row">
          <input type="checkbox" id="ip-switching" />
          <label for="ip-switching">Enable IP switching for local network</label>
        </div>

        <div class="external-field" id="external-field">
          <label class="field-label" for="external-url">External address (away from home)</label>
          <input type="text" id="external-url" placeholder="https://lifer.example.com" />
        </div>

        <div class="error" id="error" style="display: none"></div>
        <button class="primary" id="connect">Connect</button>
      </div>

      <p class="status" id="status" style="display: none; margin: 12px 0 0"></p>
    </div>

    <script src="bridge.js"></script>
    <script>
      const localButton = document.getElementById("use-local");
      const statusEl = document.getElementById("status");

      function setBusy(message) {
        statusEl.textContent = message;
        statusEl.style.display = "block";
        localButton.disabled = true;
        document.getElementById("show-server-form").disabled = true;
      }
      function clearBusy() {
        statusEl.style.display = "none";
        localButton.disabled = false;
        document.getElementById("show-server-form").disabled = false;
      }

      localButton.addEventListener("click", async () => {
        // A brand new library's very first setup call can genuinely take 10-30+ seconds (the
        // embedded database is initialized, migrated, and its species/region catalog
        // downloaded and restored — see embedded_db.rs) — with nothing shown here before this
        // fix, that stretch looked exactly like the button silently doing nothing.
        setBusy("Setting up your library… this can take a minute the first time.");
        const result = await window.liferSetup.choose({ mode: "local" });
        // A successful result navigates away entirely (see lib.rs), so reaching here at all
        // means it was canceled (the folder dialog was dismissed) or genuinely failed — either
        // way, the picker needs to be usable again rather than stuck on "Setting up…" forever.
        clearBusy();
        if (result && result.error) {
          const errorEl = document.getElementById("error");
          errorEl.textContent = result.error;
          errorEl.style.display = "block";
        }
      });
      document.getElementById("show-server-form").addEventListener("click", () => {
        document.getElementById("server-form").classList.add("open");
      });

      const ipSwitchingCheckbox = document.getElementById("ip-switching");
      const externalField = document.getElementById("external-field");
      const serverUrlLabel = document.getElementById("server-url-label");
      const serverUrlInput = document.getElementById("server-url");
      ipSwitchingCheckbox.addEventListener("change", () => {
        const on = ipSwitchingCheckbox.checked;
        externalField.classList.toggle("open", on);
        serverUrlLabel.textContent = on ? "Local address (home network)" : "Server address";
        serverUrlInput.placeholder = on ? "192.168.1.50:4000" : "https://lifer.example.com";
      });

      function normalizeUrl(raw) {
        // The local address is often a bare host:port on a LAN (no scheme) — Immich's own
        // local-address field works the same way. The external address is always a real
        // https:// domain (nginx-forwarded), so that one still requires an explicit scheme.
        if (!raw) return null;
        return /^https?:\/\//.test(raw) ? raw : `http://${raw}`;
      }

      document.getElementById("connect").addEventListener("click", async () => {
        const errorEl = document.getElementById("error");
        errorEl.style.display = "none";
        const rawServerUrl = serverUrlInput.value.trim();
        if (!rawServerUrl) {
          errorEl.textContent = ipSwitchingCheckbox.checked ? "Enter your local address." : "Enter a full URL, starting with http:// or https://";
          errorEl.style.display = "block";
          return;
        }

        let payload;
        if (ipSwitchingCheckbox.checked) {
          const rawExternalUrl = document.getElementById("external-url").value.trim();
          if (!rawExternalUrl) {
            errorEl.textContent = "Enter your external address too, or turn off IP switching.";
            errorEl.style.display = "block";
            return;
          }
          payload = { mode: "remote", localUrl: normalizeUrl(rawServerUrl), externalUrl: normalizeUrl(rawExternalUrl) };
        } else {
          if (!/^https?:\/\//.test(rawServerUrl)) {
            errorEl.textContent = "Enter a full URL, starting with http:// or https://";
            errorEl.style.display = "block";
            return;
          }
          payload = { mode: "remote", serverUrl: rawServerUrl };
        }

        const result = await window.liferSetup.choose(payload);
        if (result && result.error) {
          errorEl.textContent = result.error;
          errorEl.style.display = "block";
        }
      });
    </script>
  </body>
</html>
