resources:
  limits:
    cpus: 2.0
    memory: 4096

lifer:
  db_password: test_password
  postgres_image_selector: postgres_18_image
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/lifer/data
  app_data: /opt/tests/mnt/lifer/app_data
  postgres_data: /opt/tests/mnt/lifer/postgres_data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  app_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: app_data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
