resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: America/New_York

lifer:
  db_password: test_password
  postgres_image_selector: postgres_18_image
  additional_envs:
    - name: TRUST_PROXY
      value: "false"

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/lifer/data
      create_host_path: true
  app_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/lifer/app_data
      create_host_path: true
  postgres_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/lifer/postgres_data
      create_host_path: true
      auto_permissions: true
  additional_storage:
    - type: host_path
      mount_path: /library/archive
      host_path_config:
        path: /opt/tests/mnt/lifer/archive
        create_host_path: true
    - type: host_path
      mount_path: /library/trips
      read_only: true
      host_path_config:
        path: /opt/tests/mnt/lifer/trips
        create_host_path: true
