# Throwaway stack beside the main dev one: its own image tag, port, library and volumes.
# Build: docker build -t lifer-app:nonroot-test .
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml -p lifer-nonroot-test up -d
# Teardown (this project only): docker compose -p lifer-nonroot-test down -v
services:
  postgres:
    volumes:
      - lifer-postgres-data-test:/var/lib/postgresql/data

  permissions:
    image: lifer-app:nonroot-test
    pull_policy: never
    volumes:
      - lifer-library-test:/data

  api:
    image: lifer-app:nonroot-test
    pull_policy: never
    ports: !override
      - "4001:4000"
    volumes:
      - lifer-library-test:/data

  # Never auto-update a test stack.
  watchtower:
    profiles: ["disabled"]

volumes:
  lifer-postgres-data-test:
  lifer-library-test:
