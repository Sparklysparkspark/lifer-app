services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: lifer
      POSTGRES_PASSWORD: lifer
      POSTGRES_DB: lifer
    ports:
      - "5432:5432"
    volumes:
      - lifer-postgres-data:/var/lib/postgresql/data

  # Serves the API and the built web UI on one port. Put a reverse proxy in front for
  # TLS/a domain — that's configured on your end, not part of this repo.
  api:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://lifer:lifer@postgres:5432/lifer
      NODE_ENV: production
      PORT: ${PORT:-4000}
      DATA_DIR: /data
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Lifer <no-reply@lifer.app>}
      APP_URL: ${APP_URL:-http://localhost:4000}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ${LIFER_STORAGE_DIR:-./data/lifer}:/data

volumes:
  lifer-postgres-data:
