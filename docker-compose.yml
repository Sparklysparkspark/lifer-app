services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifer
      POSTGRES_PASSWORD: lifer
      POSTGRES_DB: lifer
    # No host port: only Lifer talks to the database, over the compose network.
    volumes:
      - lifer-postgres-data:/var/lib/postgresql/data
    # -h 127.0.0.1 waits for the real TCP listener, not the socket-only init phase on first boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lifer -d lifer"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot, runs as root: creates the folders Lifer writes to and gives them to PUID:PGID
  # (only entries whose owner differs), since the api container runs as that non-root user.
  permissions:
    image: ghcr.io/sparklysparkspark/lifer-app:latest
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["/usr/local/bin/lifer-fix-permissions"]
    command: ["/data", "/app-data"]
    environment:
      PUID: ${PUID:-568}
      PGID: ${PGID:-568}
    volumes:
      - ${LIFER_STORAGE_DIR:-./data/lifer}:/data
      - lifer-app-data:/app-data

  # Serves the API and the built web UI on one port. Put your own reverse proxy in front for TLS.
  api:
    image: ghcr.io/sparklysparkspark/lifer-app:latest
    build: .
    # Brings Lifer back after a crash or a freeze-watchdog restart (LIFER_FREEZE_RESTART_SECONDS).
    restart: unless-stopped
    # Non-root; the permissions service above makes the volumes writable for this user.
    user: "${PUID:-568}:${PGID:-568}"
    depends_on:
      postgres:
        condition: service_healthy
      permissions:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://lifer:lifer@postgres:5432/lifer
      NODE_ENV: production
      PORT: ${PORT:-4000}
      DATA_DIR: /data
      APP_DATA_DIR: /app-data
      # Reverse proxies in front of Lifer, as a hop count or proxy IPs (see the docs, reverse-proxy).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Extra folders Lifer may read and write besides /data: reimporting an existing library,
      # building trips, and saving uploads to another disk. Comma-separated, each
      # "Label=/container/path" or just "/container/path". Every entry must also be mounted
      # below. Anything outside /data and these roots is refused (403).
      LIFER_LIBRARY_ROOTS: ${LIFER_LIBRARY_ROOTS:-}
      LIFER_FREEZE_RESTART_SECONDS: ${LIFER_FREEZE_RESTART_SECONDS:-120}
      # Upload and image limits (see .env.example). Empty means Lifer's own default.
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      LIFER_MAX_IMAGE_PIXELS: ${LIFER_MAX_IMAGE_PIXELS:-}
      LIFER_UPLOAD_WORK_DIR: ${LIFER_UPLOAD_WORK_DIR:-}
      LIFER_MAX_JSON_BODY_BYTES: ${LIFER_MAX_JSON_BODY_BYTES:-}
      # Species matching uses a GPU on its own when one is passed in below and is faster.
      # "off" keeps it on the CPU, for troubleshooting only.
      LIFER_GPU: ${LIFER_GPU:-}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      # Your photo library. Stop Lifer before moving or renaming it: a running server keeps
      # the old folder open and every upload fails until it restarts.
      - ${LIFER_STORAGE_DIR:-./data/lifer}:/data
      # Lifer's own files (previews, offline map, models, catalog downloads), kept out of the
      # photo library so they never clutter it.
      - lifer-app-data:/app-data
      # Example library root (pair with LIFER_LIBRARY_ROOTS=NAS=/library/nas):
      # - /srv/nas/photos:/library/nas
    # Optional GPU for faster species matching (see the docs, hardware-acceleration).
    # NVIDIA: needs the NVIDIA driver and NVIDIA Container Toolkit on the server. Uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Intel or AMD: uncomment, and set 107 to your server's render group number, which
    # `stat -c %g /dev/dri/renderD128` prints.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "107"
    # Opts this container into Watchtower below. Remove it to update by hand instead.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Optional auto-update: hourly, pulls a newer image for labeled containers (only api, never
  # the database) and recreates them. Delete this service to update by hand.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 3600

volumes:
  lifer-postgres-data:
  lifer-app-data:
