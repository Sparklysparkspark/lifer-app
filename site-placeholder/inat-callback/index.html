<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Lifer sign-in</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f2;
        --card: #ffffff;
        --ink: #1f2420;
        --muted: #5c645e;
        --line: #e2e0d8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151816;
          --card: #1d211f;
          --ink: #ecefe9;
          --muted: #a3aba5;
          --line: #2e3430;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 1rem;
        padding: 1.5rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      #host {
        color: var(--ink);
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      #hint {
        margin-top: 0.75rem;
        font-size: 0.875rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 8px;
        background: #5f7254;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lifer</h1>
      <p id="status">Returning you to Lifer...</p>
      <p id="hint" hidden>Only continue if this is your own Lifer. If you didn't just choose Connect iNaturalist, close this page.</p>
      <button id="continue" type="button" hidden>Continue</button>
      <noscript><p>Turn on JavaScript to finish signing in to iNaturalist.</p></noscript>
    </main>
    <script>
      // Forwards iNaturalist's sign-in to the Lifer install named in `state` (`<random>.<base64url
      // origin>`). Mirrors apps/api/src/inaturalist/relayState.ts; the code is never logged or stored.
      function isAllowedReturnOrigin(origin) {
        var url;
        try {
          url = new URL(origin);
        } catch (e) {
          return false;
        }
        if (url.origin !== origin) return false;
        if (url.protocol === "https:") return true;
        if (url.protocol !== "http:") return false;
        var host = url.hostname;
        if (host === "localhost" || host === "[::1]" || /\.local$/.test(host)) return true;
        return /^\d+\.\d+\.\d+\.\d+$/.test(host) && /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host);
      }

      function decodeRelayState(state) {
        var dot = state ? state.indexOf(".") : -1;
        if (dot < 1) return null;
        var origin;
        try {
          origin = atob(state.slice(dot + 1).replace(/-/g, "+").replace(/_/g, "/"));
        } catch (e) {
          return null;
        }
        return isAllowedReturnOrigin(origin) ? origin : null;
      }

      function relayTarget(search) {
        var origin = decodeRelayState(new URLSearchParams(search).get("state"));
        return origin ? origin + "/api/inaturalist/callback" + search : null;
      }

      var target = relayTarget(location.search);
      var message = document.getElementById("status");
      if (!target) {
        message.textContent = "This sign-in link isn't valid. Go back to Lifer and choose Connect iNaturalist again.";
      } else if (!new URLSearchParams(location.search).has("code")) {
        // A declined sign-in carries nothing worth taking: straight back.
        location.replace(target);
      } else {
        // A crafted link could name someone else's server, so the code only goes on once the person
        // sees where and agrees.
        message.textContent = "Finish connecting iNaturalist to your Lifer at ";
        var host = document.createElement("span");
        host.id = "host";
        host.textContent = new URL(target).host;
        message.appendChild(host);
        message.appendChild(document.createTextNode("?"));
        document.getElementById("hint").hidden = false;
        var button = document.getElementById("continue");
        button.hidden = false;
        button.onclick = function () {
          location.replace(target);
        };
      }
    </script>
  </body>
</html>
